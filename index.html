<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D5C6C">
<meta name="description" content="صلاحية: قائمة ذكية لتراخيص الشركة وشهاداتها ومواعيدها، تنبّهك قبل الانتهاء. نسخة تجريبية.">
<title>صلاحية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230D5C6C'/%3E%3Crect x='16' y='18' width='32' height='30' rx='4' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M16 28h32M25 13v9M39 13v9' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M25 38l5 5 9-9' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root{
  --ground:#F1F4F3; --surface:#FFFFFF; --sunk:#E9EEED; --hover:#F5F8F7;
  --ink:#13222A; --ink2:#44545C; --ink3:#6B7B82; --ph:#9AA6AB;
  --line:#D6DEDD; --line2:#E6EBEA;
  --accent:#0D5C6C; --accent-ink:#FFFFFF; --accent-soft:#DCECEE; --accent-hover:#0A4C59;
  --ok:#2A7650; --ok-bg:#E1F0E7; --soon:#8F5905; --soon-bg:#F9EDD5;
  --exp:#AA3427; --exp-bg:#F6E0DC; --renew:#44509C; --renew-bg:#E5E7F5;
  --none:#56636A; --none-bg:#E8ECEC;
  --scrim:rgba(12,22,26,.42);
  --shadow:0 1px 2px rgba(19,34,42,.06),0 8px 24px rgba(19,34,42,.08);
  --shadow-lg:0 20px 50px rgba(19,34,42,.22);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1618; --surface:#162125; --sunk:#1D2A2E; --hover:#1A262A;
    --ink:#E4EBEB; --ink2:#AAB7BB; --ink3:#85949A; --ph:#5F6E73;
    --line:#2B3B40; --line2:#223135;
    --accent:#62B4C3; --accent-ink:#08181B; --accent-soft:#17353B; --accent-hover:#7CC3D0;
    --ok:#72C79E; --ok-bg:#15302A; --soon:#E2AE55; --soon-bg:#332917;
    --exp:#EF8A7C; --exp-bg:#3A201C; --renew:#A0A9F0; --renew-bg:#242A47;
    --none:#A5B0B3; --none-bg:#223034; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1618; --surface:#162125; --sunk:#1D2A2E; --hover:#1A262A;
  --ink:#E4EBEB; --ink2:#AAB7BB; --ink3:#85949A; --ph:#5F6E73;
  --line:#2B3B40; --line2:#223135;
  --accent:#62B4C3; --accent-ink:#08181B; --accent-soft:#17353B; --accent-hover:#7CC3D0;
  --ok:#72C79E; --ok-bg:#15302A; --soon:#E2AE55; --soon-bg:#332917;
  --exp:#EF8A7C; --exp-bg:#3A201C; --renew:#A0A9F0; --renew-bg:#242A47;
  --none:#A5B0B3; --none-bg:#223034; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.5;text-wrap:balance}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--exp);border-color:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:0;background:transparent;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--sunk)}
.icon-btn .ic{width:22px;height:22px}
.badge{position:absolute;top:4px;inset-inline-end:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--exp);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.field{display:grid;gap:5px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--ph);font-style:italic;opacity:1}
textarea.inp{min-height:84px;resize:vertical;line-height:1.6}
select.inp{appearance:auto}
.hint{font-size:12.5px;color:var(--ink3)}
.err{font-size:13px;color:var(--exp)}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.7}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{inset-inline-start:21px}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.9}
.pill .ic{width:14px;height:14px}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.soon{color:var(--soon);background:var(--soon-bg)}
.pill.exp{color:var(--exp);background:var(--exp-bg)} .pill.renew{color:var(--renew);background:var(--renew-bg)}
.pill.none,.pill.missing{color:var(--none);background:var(--none-bg)} .pill.acc{color:var(--accent);background:var(--accent-soft)}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);padding-top:var(--top)}
.topbar-in{max-width:1120px;margin:0 auto;padding:6px 12px;display:flex;align-items:center;gap:6px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;border:0;background:none;padding:4px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark .ic{width:19px;height:19px}
.crumb{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.crumb b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.sim-banner{background:var(--soon-bg);color:var(--ink);font-size:13px;text-align:center;padding:6px 12px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.sim-banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 6px}
main{max-width:1120px;margin:0 auto;padding:18px 16px calc(40px + var(--bot))}

/* ---------- auth ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + var(--top)) 16px calc(24px + var(--bot))}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);display:grid;gap:16px}
.auth-card .brand{justify-content:center;font-size:24px}
.auth-card .mark{width:42px;height:42px;border-radius:13px}
.auth-card h1{font-size:21px;text-align:center}
.auth-card .sub{text-align:center;color:var(--ink2);font-size:14.5px;margin:0}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:46px;height:54px;text-align:center;font-family:var(--f-mono);font-size:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0}
.otp input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.demo-note{background:var(--soon-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7}
.demo-note b{font-family:var(--f-mono);font-size:16px;letter-spacing:2px}
.consent-list{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.consent-list li{display:flex;gap:9px}
.consent-list .ic{color:var(--accent);margin-top:.3em}
.proto-tag{font-size:12.5px;color:var(--ink3);text-align:center;line-height:1.7}

/* ---------- dashboard ---------- */
.hello{margin:4px 0 14px}
.hello small{display:block;color:var(--ink3);font-size:13.5px}
.hello h1{font-size:clamp(21px,5vw,27px)}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ctr{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;display:grid;gap:0;text-align:start;min-height:74px;cursor:pointer}
.ctr b{font-family:var(--f-display);font-size:28px;line-height:1.35;font-variant-numeric:tabular-nums}
.ctr span{font-size:13.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.ctr.exp b,.ctr.exp .ic{color:var(--exp)} .ctr.soon b,.ctr.soon .ic{color:var(--soon)}
.ctr.renew b,.ctr.renew .ic{color:var(--renew)} .ctr.ok b,.ctr.ok .ic{color:var(--ok)}
.ctr[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.ctr.exp[aria-pressed="true"]{color:var(--exp)} .ctr.soon[aria-pressed="true"]{color:var(--soon)} .ctr.renew[aria-pressed="true"]{color:var(--renew)} .ctr.ok[aria-pressed="true"]{color:var(--ok)}
.ctr[aria-pressed="true"] span{color:inherit}
.quiet-line{font-size:13.5px;color:var(--ink3);margin:10px 2px 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.quiet-line button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 4px}
.panel-h h2{font-size:15.5px}
.panel-h .muted{font-size:13px}
.next-list{list-style:none;margin:0;padding:0 6px 6px}
.nrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border-top:1px solid var(--line2)}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--hover)}
.sic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.sic .ic{width:18px;height:18px}
.sic.ok{background:var(--ok-bg);color:var(--ok)} .sic.soon{background:var(--soon-bg);color:var(--soon)} .sic.exp{background:var(--exp-bg);color:var(--exp)} .sic.renew{background:var(--renew-bg);color:var(--renew)} .sic.none,.sic.missing{background:var(--none-bg);color:var(--none)}
.nrow .t b{display:block;font-weight:600;font-size:15px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .t small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.5}
.nrow .d{text-align:end;display:grid;justify-items:end;gap:2px}
.nrow .d b{font-size:13.5px;font-weight:600}
.nrow .alert-line{grid-column:2 / -1;font-size:12.5px;color:var(--ink3);line-height:1.7}
.nrow .alert-line .ic{width:13px;height:13px;margin-inline-end:3px;vertical-align:-.15em}
.empty{padding:26px 18px;text-align:center;color:var(--ink2);display:grid;gap:10px;justify-items:center}
.empty h2{font-size:18px;color:var(--ink)}
.fab-zone{display:grid;justify-items:center;gap:8px;padding:26px 0 22px}
.fab{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px var(--accent);transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.96)}
.fab .ic{width:32px;height:32px;stroke-width:2.2}
.fab-zone label{font-weight:700;color:var(--accent);font-size:15px;cursor:pointer}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.sec-title h2{font-size:17px}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;display:grid;gap:8px;text-align:start;cursor:pointer;width:100%}
.lcard:hover{border-color:var(--line)}
.lcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lcard b{font-size:15.5px;line-height:1.5}
.lcard small{color:var(--ink3);font-size:13px}
.seg{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;background:var(--line2)}
.seg i{display:block;height:100%}
.seg .ok{background:var(--ok)} .seg .soon{background:var(--soon)} .seg .exp{background:var(--exp)} .seg .renew{background:var(--renew)} .seg .none,.seg .missing{background:var(--line)}
.archived-toggle{margin-top:14px;text-align:center}

/* ---------- list view ---------- */
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.list-head h1{font-size:clamp(20px,4.6vw,25px);flex:1;min-width:0}
.list-head .meta{width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink3)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);color:var(--ink3)}
.search input{padding-inline-start:38px;min-height:42px}
.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line2);border-radius:14px}
table.grid{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
table.grid th{position:sticky;top:0;background:var(--sunk);color:var(--ink2);font-weight:600;font-size:12.5px;text-align:start;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{border-bottom:1px solid var(--line2);border-inline-start:1px solid var(--line2);padding:0;vertical-align:middle}
table.grid td:first-child{border-inline-start:0}
table.grid tr:last-child td{border-bottom:0}
table.grid td.ix{width:36px;text-align:center;color:var(--ink3);font-size:12.5px;background:var(--sunk)}
table.grid input,table.grid select{width:100%;border:0;background:transparent;padding:9px 8px;min-height:42px;font-size:14px;border-radius:0}
table.grid input:focus,table.grid select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
table.grid input::placeholder{color:var(--ph);font-style:italic;opacity:1}
table.grid td.st{padding:4px 8px;white-space:nowrap}
table.grid td.act{width:44px;text-align:center}
table.grid .c-title{min-width:190px} table.grid .c-type{width:104px} table.grid .c-issuer{min-width:150px}
table.grid .c-ref{width:124px} table.grid .c-date{width:150px} table.grid .c-note{min-width:230px}
table.grid tr.flash td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.grid-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line2);font-size:13px;color:var(--ink3)}
.mrows{display:none;list-style:none;margin:0;padding:0}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line2);cursor:pointer;background:var(--surface)}
.mrow:first-child{border-top:0}
.mrow b{display:block;font-weight:600;font-size:15px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{display:block;color:var(--ink3);font-size:12.5px}
.add-row{position:sticky;bottom:calc(12px + var(--bot));display:flex;justify-content:center;margin-top:14px;z-index:5}
.add-row .btn{box-shadow:var(--shadow);min-height:48px;padding-inline:22px;border-radius:24px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-height:92vh;max-height:92dvh;overflow:auto;margin-top:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + var(--bot));box-shadow:var(--shadow-lg);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.sheet-h h2{font-size:19px;flex:1;min-width:0}
.sheet-body{display:grid;gap:14px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.modal{margin:auto;width:calc(100% - 32px);max-width:460px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow-lg);display:grid;gap:14px;animation:up .2s ease-out}
.modal h2{font-size:18px}
.modal .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rec-status{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.rec-status .big{font-family:var(--f-display);font-weight:700;font-size:17px}
.hijri{font-size:12.5px;color:var(--ink3)}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:7px 0;position:relative}
.tl::before{content:"";position:absolute;inset-inline-start:13.5px;top:34px;bottom:-8px;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink3);position:relative}
.tl .dot .ic{width:15px;height:15px}
.tl .dot.sent{background:var(--ok-bg);color:var(--ok)} .tl .dot.today{background:var(--soon-bg);color:var(--soon)}
.tl .dot.cancelled,.tl .dot.skipped,.tl .dot.dup{background:var(--none-bg);color:var(--none)}
.tl b{font-weight:600;font-size:14px}
.tl small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.6}
.box{border:1px solid var(--line2);border-radius:14px;padding:12px 14px}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.box-h h3{font-size:14.5px;font-family:var(--f-body);font-weight:700}
.dup-warn{background:var(--soon-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px}
.dup-warn .row{display:flex;flex-wrap:wrap;gap:6px}

/* notifications panel */
.panel-side{margin-inline-start:auto;width:100%;max-width:420px;height:100%;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:side .2s ease-out;padding-top:var(--top)}
@keyframes side{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}
.panel-side .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.panel-side .ph h2{font-size:17px;flex:1}
.panel-side .pb{overflow:auto;flex:1;padding:6px 8px calc(16px + var(--bot))}
.notif{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:12px;border-bottom:1px solid var(--line2)}
.notif.unread{background:var(--accent-soft)}
.notif .nt{font-size:14px;line-height:1.6}
.notif.unread .nt{font-weight:600}
.notif small{display:block;color:var(--ink3);font-size:12px}
.notif .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.menu-list{list-style:none;margin:0;padding:6px 0;display:grid}
.menu-list button{width:100%;display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;background:none;text-align:start;font-size:15px;border-radius:10px}
.menu-list button:hover{background:var(--hover)}
.menu-list .ic{color:var(--ink3)}
.menu-list .sep{height:1px;background:var(--line2);margin:6px 12px}
.menu-list small{display:block;color:var(--ink3);font-size:12.5px}
.set-row{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line2)}
.set-row:first-child{border-top:0;padding-top:4px}
.set-row .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.set-row .hd b{font-size:15px}
.preview{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.8}
.email{border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin-bottom:12px}
.email .eh{background:var(--sunk);padding:10px 14px;font-size:12.5px;color:var(--ink2);display:grid;gap:2px}
.email .eh b{font-size:14px;color:var(--ink)}
.email .eb{padding:12px 14px;font-size:14px;display:grid;gap:8px}
.email .eb li{margin:0 0 4px}

/* toast */
.toasts{position:fixed;inset-inline:0;bottom:calc(16px + var(--bot));z-index:80;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-lg);font-size:14px;max-width:520px;animation:up .2s ease-out}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}

/* ---------- dashboard v2 ---------- */
:root{--m-exp:#C23A2C;--m-renew:#5763BE;--m-soon:#DB9A1B;--m-ok:#2E8F5E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-exp:#D9523F;--m-renew:#7079D6;--m-soon:#C0892A;--m-ok:#3A9870}}
:root[data-theme="dark"]{--m-exp:#D9523F;--m-renew:#7079D6;--m-soon:#C0892A;--m-ok:#3A9870}
.seg .ok{background:var(--m-ok)} .seg .soon{background:var(--m-soon)} .seg .exp{background:var(--m-exp)} .seg .renew{background:var(--m-renew)}
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:2px}
.dash-hero{padding:18px;display:grid;gap:14px;align-content:start}
.hero-top{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:13}
.ring .track{stroke:var(--line2)}
.ring .seg-exp{stroke:var(--m-exp)} .ring .seg-renew{stroke:var(--m-renew)} .ring .seg-soon{stroke:var(--m-soon)} .ring .seg-ok{stroke:var(--m-ok)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.25;pointer-events:none}
.ring-c b{font-family:var(--f-display);font-size:25px;color:var(--ink)}
.ring-c span{font-size:12px;color:var(--ink3)}
.hero-txt{min-width:0}
.hero-txt small{color:var(--ink3);font-size:13px}
.hero-txt h1{font-size:clamp(20px,4.4vw,26px)}
.hero-sub{margin:2px 0 0;color:var(--ink2);font-size:14px}
.priority{border-radius:12px;background:var(--sunk);padding:10px 12px;display:grid;gap:6px}
.priority.exp{background:var(--exp-bg)} .priority.soon{background:var(--soon-bg)} .priority.renew{background:var(--renew-bg)} .priority.ok{background:var(--ok-bg)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink2)}
.pr-row{display:flex;gap:10px;align-items:center}
.pr-t{flex:1;min-width:0}
.pr-t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-t small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.5}
.priority .sic{background:var(--surface)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:12px 14px;text-align:start;display:grid;gap:1px;align-content:start;transition:border-color .15s,box-shadow .15s,background .15s}
.tile:hover{border-color:var(--line)}
.tile-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.tile-h b{font-family:var(--f-display);font-size:30px;line-height:1.25;color:var(--ink)}
.tile-l{font-weight:700;font-size:14.5px}
.tile small{color:var(--ink3);font-size:12.5px;line-height:1.5}
.tile[aria-pressed="true"],.bucket[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.horizon{grid-column:1 / -1;padding:14px 16px}
.hz-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;margin-bottom:10px}
.hz-head h2{font-size:15.5px}
.hz-quiet{font-size:13px;color:var(--ink3)}
.hz-quiet button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.buckets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bucket{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:end;text-align:start}
.bucket:hover{background:var(--hover)}
.bk-l{font-weight:600;font-size:14px;line-height:1.4}
.bk-l small{display:block;color:var(--ink3);font-weight:400;font-size:12px}
.bucket b{font-family:var(--f-display);font-size:22px;line-height:1.2}
.bk-bar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:block}
.bk-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.home-sec{margin-top:4px}
.count{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 7px;border-radius:11px;background:var(--sunk);color:var(--ink2);font-size:12.5px;font-family:var(--f-body);font-weight:600;vertical-align:.2em;margin-inline-start:4px}
.lcard .top b{min-width:0}
.lc-n{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.lc-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px}
.lc-foot small{margin-inline-start:auto}
.detail{margin-top:22px;overflow:hidden}
.detail-h{display:flex;align-items:center;gap:8px;padding:6px 8px}
.detail-toggle{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 6px;text-align:start;border-radius:10px;min-width:0;flex-wrap:wrap}
.detail-toggle:hover{background:var(--hover)}
.detail-toggle h2{font-size:16px}
.chev{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sunk);color:var(--ink2);flex:none}
.chev .ic{width:16px;height:16px;transform:rotate(180deg);transition:transform .2s}
.detail-toggle[aria-expanded="true"] .chev .ic{transform:rotate(90deg)}
.detail-peek{font-size:13px}
@media (max-width:860px){
  .dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .dash-hero{padding:14px}
  .hero-top{gap:14px}
  .ring{width:100px;height:100px}
  .ring-c b{font-size:21px}
  .tiles{gap:10px}
  .tile{padding:10px 12px}
  .tile-h b{font-size:26px}
  .horizon{padding:12px}
  .buckets{gap:8px}
  .bucket{padding:8px 10px}
  .bk-l{font-size:13px}
  .bk-l small{display:none}
  .bucket b{font-size:20px}
}
@media (max-width:760px){
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-wrap.has-rows table.grid{display:none}
  .grid-wrap.has-rows .grid-foot{display:none}
  .grid-wrap .mrows{display:block}
  .two-col{grid-template-columns:1fr}
}
@media (min-width:761px){
  .scrim.as-drawer .sheet{margin:0;margin-inline-start:auto;height:100%;max-height:none;width:480px;border-radius:0;padding-top:calc(14px + var(--top));animation:side .2s ease-out}
  .scrim.as-drawer .sheet .grab{display:none}
}
@media (max-width:380px){
  .otp input{width:40px;height:50px}
  .nrow{grid-template-columns:30px minmax(0,1fr) auto;gap:4px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* =========================================================
   صلاحية — نموذج أولي. كل البيانات تُحفظ في متصفح هذا الجهاز.
   ========================================================= */
var STORE_KEY = "salahiya_proto_v1";
var DAY = 86400000;
var POLICY_VERSION = "0.1-proto";

var TYPES = [
  { v: "license", l: "ترخيص" },
  { v: "cert", l: "شهادة" },
  { v: "accred", l: "اعتماد" },
  { v: "member", l: "عضوية" },
  { v: "contract", l: "عقد أو وثيقة" },
  { v: "appt", l: "موعد" },
  { v: "other", l: "أخرى" }
];
function typeLabel(v) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].v === v) return TYPES[i].l; return "ترخيص"; }

var STATUS = {
  ok:      { l: "سارية",            ic: "i-check", rank: 3 },
  soon:    { l: "تقترب",            ic: "i-clock", rank: 1 },
  exp:     { l: "منتهية",           ic: "i-x",     rank: 0 },
  renew:   { l: "بانتظار التجديد",  ic: "i-renew", rank: 2 },
  none:    { l: "لا ينتهي",          ic: "i-minus", rank: 5 },
  missing: { l: "ناقص التاريخ",     ic: "i-alert", rank: 4 }
};

var KIND = {
  first: "التنبيه الأول",
  extra: "تنبيه إضافي",
  day_before: "تنبيه قبل يوم",
  renewal: "تذكير التجديد",
  followup: "تذكير متابعة الطلب",
  snooze: "تذكير مؤجَّل"
};

/* ---------------- helpers ---------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid(p) { return (p || "id") + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function icon(id, cls) { return '<svg class="ic' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }

var nf; try { nf = new Intl.NumberFormat("ar-SA-u-nu-arab"); } catch (e) { nf = new Intl.NumberFormat("ar"); }
function n(x) { return nf.format(x); }
function mkDTF(loc, o) { try { return new Intl.DateTimeFormat(loc, o); } catch (e) { return new Intl.DateTimeFormat("ar", o); } }
var fG = mkDTF("ar-SA-u-ca-gregory-nu-arab", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
var fGshort = mkDTF("ar-SA-u-ca-gregory-nu-arab", { day: "numeric", month: "long", timeZone: "UTC" });
var fH = mkDTF("ar-SA-u-ca-islamic-umalqura-nu-arab", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

/* dates are handled as "YYYY-MM-DD" strings and UTC-midnight numbers */
function realTodayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pad(x) { return (x < 10 ? "0" : "") + x; }
function toT(s) { if (!s) return null; var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
function toS(t) { return new Date(t).toISOString().slice(0, 10); }
function addDays(s, k) { return toS(toT(s) + k * DAY); }
function diffDays(a, b) { return Math.round((toT(a) - toT(b)) / DAY); } /* a - b */
function fmtDate(s, short) { if (!s) return ""; try { return (short ? fGshort : fG).format(new Date(toT(s))); } catch (e) { return s; } }
function fmtHijri(s) { if (!s) return ""; try { return fH.format(new Date(toT(s))); } catch (e) { return ""; } }
function days(k) {
  k = Math.abs(k);
  if (k === 0) return "اليوم";
  if (k === 1) return "يوم واحد";
  if (k === 2) return "يومان";
  if (k <= 10) return n(k) + " أيام";
  return n(k) + " يوماً";
}
function records(k) {
  if (k === 1) return "سجل واحد";
  if (k === 2) return "سجلان";
  if (k >= 3 && k <= 10) return n(k) + " سجلات";
  return n(k) + " سجلاً";
}
function hourLabel(h) { var p = h < 12 ? "ص" : "م"; var hh = h % 12; if (hh === 0) hh = 12; return n(hh) + ":٠٠ " + p; }
function tzName() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "—"; } catch (e) { return "—"; } }

/* ---------------- state ---------------- */
var S = null;
function blankState() {
  return {
    v: 1,
    user: null,             /* { email, name, since } */
    consent: null,          /* { version, at, marketing } */
    settings: { firstDays: 30, extraDays: null, renewAfter: 3, renewRepeats: 2, sendHour: 9, email: true },
    lists: [],
    records: [],
    notifications: [],
    emails: [],
    offset: 0,              /* testing: days added to the real date */
    prefs: { nextOpen: true },
    theme: null
  };
}
function load() {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (!raw) return blankState();
  try {
    var st = JSON.parse(raw);
    var b = blankState();
    for (var k in b) if (!(k in st)) st[k] = b[k];
    return st;
  } catch (e) { return blankState(); }
}
var storageOk = true;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function today() { return addDays(realTodayStr(), S.offset || 0); }

function getList(id) { for (var i = 0; i < S.lists.length; i++) if (S.lists[i].id === id) return S.lists[i]; return null; }
function getRec(id) { for (var i = 0; i < S.records.length; i++) if (S.records[i].id === id) return S.records[i]; return null; }

/* ---------------- status ---------------- */
function alertCfg(r) {

function statusOf(r) {

  if (st === "missing") return "أضف التاريخ لتفعيل التنبيه";

function sortKey(r) {

}

/* ---------------- alert engine ----------------
   Every occurrence has a dedupe key: record:expiry:kind:seq.
   A key is fired at most once; a date moved by 14 days or less does not re-send a kind already sent. */
function plannedAlerts(r) {
  var out = [];

  var cfg = alertCfg(r), E = r.expiry, setOn = r.setOn || today();
  var requested = r.renewal && r.renewal.state === "requested";
  function push(kind, seq, due, extra) {
    var o = { key: r.id + ":" + E + ":" + kind + ":" + seq, kind: kind, seq: seq, due: due, expiry: E };
    if (extra) for (var k in extra) o[k] = extra[k];

  if (cfg.extraDays && cfg.extraDays < cfg.firstDays && cfg.extraDays > 1) push("extra", 0, addDays(E, -cfg.extraDays));

  for (var i = 0; i <= cfg.renewRepeats; i++) push("renewal", i, addDays(base, cfg.renewAfter + 7 * i));
  (r.snoozes || []).forEach(function (sn, i) { push("snooze", i, sn.due, { snoozeId: sn.id }); });
  if (requested) {
    out.forEach(function (o) { if (o.due > r.renewal.requestedAt) o.cancelledBy = "requested"; });
    if (r.renewal.followup) out.push({ key: r.id + ":" + E + ":followup:" + r.renewal.followup, kind: "followup", seq: 0, due: r.renewal.followup, expiry: E });

}
function logFor(r, key) { var L = r.alertLog || []; for (var i = 0; i < L.length; i++) if (L[i].key === key) return L[i]; return null; }
function alreadySentNearby(r, a) {

    var e = L[i];

  }

}
/* describe an occurrence for the record timeline (does not mutate) */
function alertView(r, a) {

function alertText(r, kind, ref) {

    case "day_before": return d === 1 ? "غداً آخر يوم لسريان «" + t + "»." : "«" + t + "» تنتهي في " + fmtDate(E) + ".";
    case "renewal": return d < 0 ? "انتهت «" + t + "» منذ " + days(d) + ". هل جددتها؟" : "حان موعد تجديد «" + t + "».";
    case "followup": return "هل صدرت «" + t + "» الجديدة؟ أدخل تاريخ انتهائها.";
    case "snooze": return "تذكير مؤجَّل: «" + t + "» " + (d > 0 ? "تنتهي بعد " + days(d) : d === 0 ? "تنتهي اليوم" : "انتهت منذ " + days(d)) + ".";

/* fire everything due up to today; returns number of new in-app notifications */
function runEngine() {

      if (a.due > t || logFor(r, a.key)) return;
      if (a.cancelledBy) return;

      if (a.kind !== "snooze" && a.kind !== "followup" && a.due < setOn) { entry.status = "skipped"; r.alertLog.push(entry); return; }

      if (near) { entry.status = "dup"; r.alertLog.push(entry); return; }
      var justEntered = a.due === setOn && a.kind !== "snooze" && a.kind !== "followup";
      var useEmail = S.settings.email && !justEntered;

      r.alertLog.push(entry);
      var note = { id: uid("n"), recordId: r.id, kind: a.kind, text: alertText(r, a.kind, a.due), at: a.due, read: false };

    });
  });
  Object.keys(emailByDay).sort().forEach(function (d) {
    var items = emailByDay[d];
    items.sort(function (a, b) { return STATUS[a.status].rank - STATUS[b.status].rank; });
    var first = getRec(items[0].recordId);
    var subj = (first ? first.title : "تنبيه") + (items.length === 2 ? " (+ تنبيه آخر)" : items.length > 2 ? " (+" + n(items.length - 1) + " تنبيهات أخرى)" : "");
    S.emails.unshift({ id: uid("e"), day: d, hour: S.settings.sendHour, to: S.user ? S.user.email : "", subject: subj, items: items });
  });
  if (S.notifications.length > 200) S.notifications.length = 200;
  if (S.emails.length > 60) S.emails.length = 60;
  return fired.length;
}
</script>

    '<p style="margin:0;font-size:14px"><button type="button" class="btn ghost sm" data-act="policy">اقرأ سياسة الخصوصية والشروط كاملة</button></p>' +
    '<label class="chk"><input type="checkbox" id="c1"><span>قرأت سياسة الخصوصية وحماية البيانات الشخصية وأوافق عليها.</span></label>' +
    '<label class="chk"><input type="checkbox" id="c2"><span>أقرّ بأن «صلاحية» أداة تذكير لا تقدم استشارة قانونية ولا تضمن الامتثال، وأن التحقق من المواعيد والتجديد مسؤوليتي.</span></label>' +
    '<label class="chk"><input type="checkbox" id="c3"><span class="muted">أرغب في رسائل عن تحديثات المنتج (اختياري)</span></label>' +
    '<button class="btn pri block" type="submit" id="consent-go" disabled>موافق، لنبدأ</button>' +
    '<button type="button" class="btn ghost" data-act="consent-decline">لا أوافق</button>' +
    '<p class="proto-tag">نص تجريبي للاختبار، ويخضع لمراجعة قانونية قبل الإطلاق.</p>' +
    "</form></div>";
}

/* ---------------- home ---------------- */
function counts() {
  var c = { ok: 0, soon: 0, exp: 0, renew: 0, none: 0, missing: 0 };
  liveRecords().forEach(function (r) { c[statusOf(r)]++; });
  return c;
}
function nextAlertLine(r) {
  var st = statusOf(r);
  if (st === "none" || st === "missing") return "";
  if (st === "renew") return icon("i-clock") + "متابعة الطلب في " + fmtDate(r.renewal.followup, true);
  var t = today(), plan = plannedAlerts(r), lastSent = null, next = null;
  plan.forEach(function (a) {
    var v = alertView(r, a);
    if (v.state === "sent" && (!lastSent || a.due > lastSent.due)) lastSent = a;
    if (v.state === "scheduled" && !next) next = a;
  });
  var snoozed = (r.snoozes || []).filter(function (s) { return s.due > t; })[0];
  if (snoozed) return icon("i-pause") + "مؤجَّل إلى " + fmtDate(snoozed.due, true);
  if (lastSent && diffDays(t, lastSent.due) <= 10) return icon("i-check") + KIND[lastSent.kind] + " أُرسل " + fmtDate(lastSent.due, true) + (next ? " · التالي " + fmtDate(next.due, true) : "");
  if (next) return icon("i-clock") + "التنبيه التالي " + fmtDate(next.due, true);
  return "";
}
function recRow(r, cls) {
  var st = statusOf(r), l = getList(r.listId);
  var al = nextAlertLine(r);
  return '<li class="' + cls + '" data-act="open-rec" data-id="' + r.id + '" tabindex="0" role="button">' +
    '<span class="sic ' + st + '">' + icon(STATUS[st].ic) + "</span>" +
    '<div class="t"><b>' + esc(r.title) + "</b><small>" + esc(l ? l.name : "") + " · " + typeLabel(r.type) + "</small></div>" +
    '<div class="d"><span class="pill ' + st + '">' + STATUS[st].l + "</span><small class=\"muted num\">" + (r.expiry && !r.noExpiry ? fmtDate(r.expiry) : "") + "</small></div>" +
    '<div class="alert-line">' + esc("") + relText(r) + (al ? " · " + al : "") + "</div>" +
    "</li>";
}
var BUCKETS = {
  b7:  { l: "هذا الأسبوع",  hint: "خلال ٧ أيام",        from: 0,  to: 7 },
  b30: { l: "خلال الشهر",   hint: "من ٨ إلى ٣٠ يوماً",  from: 8,  to: 30 },
  b90: { l: "خلال ٣ أشهر",  hint: "من ٣١ إلى ٩٠ يوماً", from: 31, to: 90 }
};
var TILE_HINT = { exp: "تجاوزت تاريخ انتهائها", soon: "دخلت فترة التنبيه", renew: "طلبات قيد المتابعة", ok: "لا تحتاج إجراء الآن" };
function bucketOf(r) {
  if (r.noExpiry || !r.expiry || (r.renewal && r.renewal.state === "requested")) return null;
  var d = diffDays(r.expiry, today());
  for (var k in BUCKETS) if (d >= BUCKETS[k].from && d <= BUCKETS[k].to) return k;
  return null;
}
function matchFilter(r, f) { return BUCKETS[f] ? bucketOf(r) === f : statusOf(r) === f; }
function filterLabel(f) { return BUCKETS[f] ? "تنتهي " + BUCKETS[f].l : STATUS[f].l; }

function donut(c) {
  var order = ["exp", "renew", "soon", "ok"];
  var total = order.reduce(function (s, k) { return s + c[k]; }, 0);
  var R = 52, C = 2 * Math.PI * R, gap = total > 1 ? 2.5 : 0, pos = 0, segs = "";
  order.forEach(function (k) {
    if (!c[k]) return;
    var len = C * c[k] / total;
    var draw = Math.max(len - gap, 1.5);
    segs += '<circle class="seg-' + k + '" cx="64" cy="64" r="' + R + '" stroke-dasharray="' + draw.toFixed(2) + " " + (C - draw).toFixed(2) + '" stroke-dashoffset="' + (-pos).toFixed(2) + '"><title>' + STATUS[k].l + ": " + n(c[k]) + "</title></circle>";
    pos += len;
  });
  var okPct = total ? Math.round(c.ok / total * 100) : 0;
  return '<div class="ring" role="img" aria-label="' + esc(order.filter(function (k) { return c[k]; }).map(function (k) { return STATUS[k].l + " " + n(c[k]); }).join("، ")) + '">' +
    '<svg viewBox="0 0 128 128" aria-hidden="true"><circle class="track" cx="64" cy="64" r="' + R + '"></circle><g transform="rotate(-90 64 64)">' + segs + "</g></svg>" +
    '<div class="ring-c"><b class="num">' + n(okPct) + "٪</b><span>سارية</span></div></div>";
}

function viewHome() {
  var c = counts(), live = liveRecords();
  var name = S.user.name;
  var attention = c.exp + c.soon + c.renew;
  var tracked = c.exp + c.soon + c.renew + c.ok;
  var lists = S.lists.filter(function (l) { return !l.deleted && !l.archived; });
  var archived = S.lists.filter(function (l) { return !l.deleted && l.archived; });
  var h = "";

  if (!live.length && !lists.length) {
    h += '<div class="hello"><small>مرحباً ' + esc(name) + "</small><h1>لنبدأ أول قائمة</h1></div>";
    h += '<div class="card empty"><h2>أضف أول قائمة لتبدأ التنبيهات</h2><p style="margin:0;max-width:44ch">سمِّ القائمة، مثل «تراخيص المنشأة» أو «الشهادات الصحية للعاملين»، ثم أدخل ما لديك من تراخيص وشهادات ومواعيد.</p>' +
      '<button class="btn" data-act="seed">' + icon("i-fast") + "جرّب ببيانات شركة نموذجية</button></div>";
    h += '<div class="fab-zone"><button class="fab" id="fab-new" data-act="new-list" aria-label="قائمة جديدة">' + icon("i-plus") + '</button><label for="fab-new">قائمة جديدة</label></div>';
    return h;
  }

  /* ---------- 1. dashboard ---------- */
  var urgent = live.filter(function (r) { var s = statusOf(r); return s === "exp" || s === "soon" || s === "renew"; }).sort(bySoonest)[0];
  var nextOk = !urgent ? live.filter(function (r) { return statusOf(r) === "ok"; }).sort(byExpiry)[0] : null;
  var head = attention ? records(attention) + " " + (attention === 1 ? "يحتاج" : attention === 2 ? "يحتاجان" : "تحتاج") + " انتباهك" : "كل شيء ساري المفعول";
  var priority = "";
  if (urgent) {
    var us = statusOf(urgent);
    priority = '<div class="priority ' + us + '"><span class="eyebrow">الأولوية الآن</span>' +
      '<div class="pr-row"><span class="sic ' + us + '">' + icon(STATUS[us].ic) + '</span><div class="pr-t"><b>' + esc(urgent.title) + "</b><small>" + relText(urgent) + "</small></div>" +
      (us === "renew" ? '<button class="btn sm" data-act="open-rec" data-id="' + urgent.id + '">متابعة</button>' : '<button class="btn sm pri" data-act="renew" data-id="' + urgent.id + '">تم التجديد</button>') + "</div></div>";
  } else if (nextOk) {
    priority = '<div class="priority ok"><span class="eyebrow">أقرب انتهاء</span><div class="pr-row"><span class="sic ok">' + icon("i-check") + '</span><div class="pr-t"><b>' + esc(nextOk.title) + "</b><small>" + relText(nextOk) + "</small></div>" +
      '<button class="btn sm" data-act="open-rec" data-id="' + nextOk.id + '">فتح</button></div></div>';
  }

  var bc = { b7: 0, b30: 0, b90: 0 };
  live.forEach(function (r) { var b = bucketOf(r); if (b) bc[b]++; });
  var bmax = Math.max(1, bc.b7, bc.b30, bc.b90);

  h += '<section class="dash" aria-label="لوحة التحكم">';
  h += '<div class="dash-hero card">' +
    '<div class="hero-top">' + donut(c) +
    '<div class="hero-txt"><small>مرحباً ' + esc(name) + " · " + fmtDate(today()) + "</small><h1>" + head + "</h1>" +
    '<p class="hero-sub">' + (tracked ? n(c.ok) + " من " + records(tracked) + " سارية" : "لا توجد سجلات بتواريخ بعد") + "</p></div></div>" +
    priority + "</div>";

  h += '<div class="tiles" role="group" aria-label="تصفية حسب الحالة">' +
    ["exp", "soon", "renew", "ok"].map(function (k) {
      return '<button class="tile ' + k + '" data-act="filter" data-k="' + k + '" aria-pressed="' + (UI.filter === k) + '">' +
        '<span class="tile-h"><span class="sic ' + k + '">' + icon(STATUS[k].ic) + "</span><b class=\"num\">" + n(c[k]) + "</b></span>" +
        '<span class="tile-l">' + STATUS[k].l + "</span><small>" + TILE_HINT[k] + "</small></button>";
    }).join("") + "</div>";

  h += '<div class="horizon card"><div class="hz-head"><h2>ما ينتهي قريباً</h2>' +
    ((c.none || c.missing) ? '<span class="hz-quiet">' + (c.missing ? '<button data-act="filter" data-k="missing">' + records(c.missing) + " ناقص التاريخ</button>" : "") + (c.none && c.missing ? " · " : "") + (c.none ? records(c.none) + " لا " + (c.none === 1 ? "ينتهي" : "تنتهي") : "") + "</span>" : "") + "</div>" +
    '<div class="buckets">' + ["b7", "b30", "b90"].map(function (k) {
      var pct = Math.round(bc[k] / bmax * 100);
      return '<button class="bucket" data-act="filter" data-k="' + k + '" aria-pressed="' + (UI.filter === k) + '" title="' + esc(BUCKETS[k].hint + ": " + records(bc[k])) + '">' +
        '<span class="bk-l">' + BUCKETS[k].l + '<small>' + BUCKETS[k].hint + '</small></span><b class="num">' + n(bc[k]) + "</b>" +
        '<span class="bk-bar"><i style="width:' + (bc[k] ? Math.max(pct, 4) : 0) + '%"></i></span></button>';
    }).join("") + "</div></div>";
  h += "</section>";

  /* ---------- new list ---------- */
  h += '<div class="fab-zone"><button class="fab" id="fab-new" data-act="new-list" aria-label="قائمة جديدة">' + icon("i-plus") + '</button><label for="fab-new">قائمة جديدة</label></div>';

  /* ---------- 2. lists ---------- */
  if (lists.length) {
    h += '<section class="home-sec"><div class="sec-title"><h2>قوائمك <span class="count num">' + n(lists.length) + '</span></h2><span class="muted" style="font-size:13px">الأكثر إلحاحاً أولاً</span></div><div class="lists">';
    lists.map(function (l) {
      var rs = listRecords(l.id), cc = { exp: 0, soon: 0, renew: 0, ok: 0, missing: 0, none: 0 }, nearest = null;
      rs.forEach(function (r) { var s = statusOf(r); cc[s]++; if (r.expiry && !r.noExpiry && r.expiry >= today() && (!nearest || r.expiry < nearest)) nearest = r.expiry; });
      return { l: l, rs: rs, cc: cc, nearest: nearest, key: cc.exp ? 0 : cc.renew ? 1 : cc.soon ? 2 : 3 };
    }).sort(function (a, b) { return a.key - b.key || ((a.nearest || "9") < (b.nearest || "9") ? -1 : 1); })
      .forEach(function (x) {
        var segs = ["exp", "renew", "soon", "ok", "missing", "none"].filter(function (k) { return x.cc[k]; })
          .map(function (k) { return '<i class="' + k + '" style="flex:' + x.cc[k] + '"></i>'; }).join("");
        var alt = ["exp", "renew", "soon", "ok"].filter(function (k) { return x.cc[k]; }).map(function (k) { return n(x.cc[k]) + " " + STATUS[k].l; }).join("، ");
        var tags = ["exp", "renew", "soon"].filter(function (k) { return x.cc[k]; }).map(function (k) { return '<span class="pill ' + k + '">' + n(x.cc[k]) + " " + STATUS[k].l + "</span>"; }).join("");
        h += '<button class="lcard" data-act="open-list" data-id="' + x.l.id + '"><span class="top"><b>' + esc(x.l.name) + '</b><span class="lc-n num">' + records(x.rs.length) + "</span></span>" +
          '<span class="seg" role="img" aria-label="' + esc(alt || "لا سجلات") + '">' + segs + "</span>" +
          '<span class="lc-foot">' + (tags || '<span class="pill ok">' + icon("i-check") + "كلها سارية</span>") +
          (x.nearest ? '<small>أقرب انتهاء ' + fmtDate(x.nearest, true) + "</small>" : "") + "</span></button>";
      });
    h += "</div>";
    if (archived.length) {
      h += '<div class="archived-toggle"><button class="btn ghost sm" data-act="toggle-archived">' + (UI.showArchived ? "إخفاء" : "عرض") + " القوائم المؤرشفة (" + n(archived.length) + ")</button></div>";
      if (UI.showArchived) {
        h += '<div class="lists" style="margin-top:10px">' + archived.map(function (l) {
          return '<div class="lcard" style="cursor:default"><span class="top"><b>' + esc(l.name) + '</b><span class="pill none">مؤرشفة</span></span><small>' + records(listRecords(l.id).length) + " · تنبيهاتها متوقفة</small>" +
            '<span><button class="btn sm" data-act="unarchive" data-id="' + l.id + '">إلغاء الأرشفة</button></span></div>';
        }).join("") + "</div>";
      }
    }
    h += "</section>";
  }

  /* ---------- 3. detail list (collapsible) ---------- */
  var pool = live.slice();
  if (UI.filter) pool = pool.filter(function (r) { return matchFilter(r, UI.filter); });
  else pool = pool.filter(function (r) { var s = statusOf(r); return s === "exp" || s === "soon" || s === "renew"; });
  pool.sort(bySoonest);
  var open = UI.filter ? true : S.prefs.nextOpen !== false;
  var title = UI.filter ? filterLabel(UI.filter) : "تحتاج انتباهك";
  h += '<section class="home-sec card detail" id="detail">' +
    '<div class="detail-h"><button class="detail-toggle" data-act="toggle-detail" aria-expanded="' + open + '" aria-controls="detail-body">' +
    '<span class="chev">' + icon("i-back") + "</span><h2>" + title + ' <span class="count num">' + n(pool.length) + "</span></h2>" +
    (open ? "" : '<span class="muted detail-peek">' + (pool.length ? "اضغط لعرض التفاصيل" : "لا شيء هنا") + "</span>") + "</button>" +
    (UI.filter ? '<button class="btn ghost sm" data-act="filter" data-k="">إلغاء التصفية</button>' : "") + "</div>" +
    '<div id="detail-body"' + (open ? "" : " hidden") + ">" +
    (pool.length ? '<ul class="next-list">' + pool.map(function (r) { return recRow(r, "nrow"); }).join("") + "</ul>" : '<div class="empty" style="padding:18px">لا توجد سجلات هنا.</div>') +
    "</div></section>";
  return h;
}

<script>

var NOTE_PH_SHORT = "الأثر · الارتباط · المسؤول";

function issuerSuggestions() {

function afterList(listId) {

    var s2 = $("#list-search"); if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
  });
  $all("table.grid [data-f]").forEach(function (inp) {
    inp.addEventListener(inp.type === "date" ? "blur" : "change", function () { gridCommit(inp); });
    inp.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" || inp.tagName === "SELECT") return;
      ev.preventDefault();
      var tr = inp.closest("tr"), f = inp.getAttribute("data-f");

      var next = tr && tr.nextElementSibling;
      var id = next ? next.getAttribute("data-id") : null;
      if (id) { var target = $('tr[data-id="' + id + '"] [data-f="' + f + '"]'); if (target) target.focus(); }

}
function gridCommit(inp) {

  var r = getRec(tr.getAttribute("data-id")); if (!r) return;
  var f = inp.getAttribute("data-f"), v = inp.value;
  if ((r[f] || "") === v) return;
  if (f === "title" && !v.trim()) { inp.value = r.title; toast("اسم السجل مطلوب."); return; }
  var ch = {}; ch[f] = f === "expiry" ? (v || null) : v;
  var res = updateRecord(r, ch);
  if (res === false) { inp.value = r[f] || ""; return; }
  save();
  var pill = tr.querySelector(".st .pill"), st = statusOf(r);
  if (pill) { pill.className = "pill " + st; pill.textContent = STATUS[st].l; }
  if (f === "expiry" || f === "title") { refreshBadge(); }

}
function refreshBadge() {

/* ---------------- record mutations ---------------- */
function normalize(s) {
  return String(s || "").toLowerCase()
    .replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
    .replace(/[٠-٩]/g, function (c) { return String("٠١٢٣٤٥٦٧٨٩".indexOf(c)); })
    .replace(/[\s\-_/.:]+/g, "");
}
function findDuplicate(r, fields) {
  var title = fields.title != null ? fields.title : r.title, ref = fields.ref != null ? fields.ref : r.ref;
  var issuer = fields.issuer != null ? fields.issuer : r.issuer, exp = fields.expiry !== undefined ? fields.expiry : r.expiry;
  var others = S.records.filter(function (x) { return !x.deleted && x.id !== r.id; });
  for (var i = 0; i < others.length; i++) {
    var o = others[i];
    if (ref && o.ref && normalize(o.ref) === normalize(ref) && normalize(o.issuer) === normalize(issuer)) return o;
    if (!ref && !o.ref && title && normalize(o.title) === normalize(title) && (o.expiry || "") === (exp || "")) return o;
  }
  return null;
}
function updateRecord(r, ch, opts) {
  opts = opts || {};
  if (ch.expiry !== undefined && ch.expiry) {
    var y = +ch.expiry.slice(0, 4), ty = +today().slice(0, 4);
    if (y < 2000 || y > ty + 50) {
      if (!window.confirm("السنة " + y + " تبدو غير معتادة. هل التاريخ صحيح؟")) return false;
    }
  }
  var oldExpiry = r.expiry;
  var before = JSON.stringify({ expiry: r.expiry, noExpiry: r.noExpiry });
  Object.keys(ch).forEach(function (k) { r[k] = ch[k]; });
  if (ch.noExpiry) r.expiry = null;
  if (ch.expiry !== undefined && ch.expiry !== oldExpiry) { r.setOn = today(); r.snoozes = []; }
  r.updatedAt = today();
  if (!opts.silentDup && (ch.ref !== undefined || ch.title !== undefined || ch.issuer !== undefined)) {
    var d = findDuplicate(r, {});
    if (d && !r.dupIgnored) {
      var dl = getList(d.listId);
      toast("سجل مشابه موجود في «" + (dl ? dl.name : "") + "»: " + d.title, "فتحه", function () { openRecord(d.id); }, 8000);
    }
  }
  if (before !== JSON.stringify({ expiry: r.expiry, noExpiry: r.noExpiry })) {
    var fired = runEngine();
    if (ch.expiry !== undefined && oldExpiry && ch.expiry && oldExpiry !== ch.expiry) {
      var sched = plannedAlerts(r).filter(function (a) { return alertView(r, a).state === "scheduled"; }).length;
      setTimeout(function () { toast("أُعيدت جدولة التنبيهات: " + n(sched) + " مجدولة"); }, 400);
    }
    if (fired) refreshBadge();
  }
  return true;
}
function newRecord(listId, fields) {
  var r = { id: uid("r"), listId: listId, type: "license", title: "", issuer: "", ref: "", expiry: null, noExpiry: false, note: "",
    renewal: { state: "none" }, override: null, snoozes: [], alertLog: [], history: [], setOn: today(), createdAt: today(), updatedAt: today() };
  for (var k in fields) r[k] = fields[k];

      if (v.state === "sent") { dot = "sent"; icn = "i-check"; sub = "أُرسل " + when + " · داخل النظام ✓" + (v.channels && v.channels.email ? " · البريد ✓" : " · دون بريد"); }

      else if (v.state === "dup") { dot = "dup"; icn = "i-minus"; sub = "لم يُكرَّر: أُرسل سابقاً قبل تعديل التاريخ"; }
      else if (v.state === "cancelled") { dot = "cancelled"; icn = "i-minus"; sub = "أُلغي بعد تسجيل طلب التجديد"; }

      var label = KIND[a.kind] + (a.kind === "first" ? " (قبل " + days(cfg.firstDays) + ")" : a.kind === "extra" ? " (قبل " + days(cfg.extraDays) + ")" : a.kind === "renewal" && a.seq ? " (تكرار " + n(a.seq) + ")" : "");

  var ne = $("#f-noexp"), fe = $("#f-expiry"), fh = $("#f-hijri");

function submitRecord(form) {

function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(recs, filename) {
  var head = ["القائمة", "الاسم", "النوع", "الجهة المصدرة", "الرقم", "تاريخ الانتهاء", "التاريخ الهجري", "الحالة", "ملاحظة"];
  var lines = [head.join(",")].concat(recs.map(function (r) {
    var l = getList(r.listId), st = statusOf(r);
    return [l ? l.name : "", r.title, typeLabel(r.type), r.issuer, r.ref, r.noExpiry ? "لا ينتهي" : (r.expiry || ""), r.expiry ? fmtHijri(r.expiry) : "", STATUS[st].l, r.note].map(csvCell).join(",");
  }));
  var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  try {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("جُهّز الملف " + filename);
  } catch (e) { toast("تعذّر تنزيل الملف في هذا المتصفح."); }
}

var PASTE_ROWS = [];

function parseDateLoose(s) {
  s = String(s || "").trim().replace(/[٠-٩]/g, function (c) { return String("٠١٢٣٤٥٦٧٨٩".indexOf(c)); });
  var m;
  if ((m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s))) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  if ((m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/.exec(s))) return m[3] + "-" + pad(+m[2]) + "-" + pad(+m[1]);
  return null;
}
function previewPaste(text, listId) {
  var lines = text.split(/\r?\n/).filter(function (x) { return x.trim(); });
  PASTE_ROWS = lines.map(function (line) {
    var c = line.indexOf("\t") >= 0 ? line.split("\t") : line.split(/\s{2,}|,/);
    var row = { title: (c[0] || "").trim(), issuer: (c[1] || "").trim(), ref: (c[2] || "").trim(), rawDate: (c[3] || "").trim(), note: (c[4] || "").trim() };
    row.expiry = parseDateLoose(row.rawDate);
    row.dup = !!findDuplicate({ id: "_" }, { title: row.title, ref: row.ref, issuer: row.issuer, expiry: row.expiry });
    return row;
  }).filter(function (r) { return r.title; });
  var go = $("#paste-go");
  if (!PASTE_ROWS.length) { $("#paste-preview").innerHTML = ""; go.disabled = true; go.textContent = "إضافة"; return; }
  var dups = PASTE_ROWS.filter(function (r) { return r.dup; }).length;
  $("#paste-preview").innerHTML = '<div class="box"><div class="box-h"><h3>معاينة (' + n(PASTE_ROWS.length) + ")</h3>" + (dups ? '<span class="pill soon">' + n(dups) + " مشابه لسجل موجود</span>" : "") + "</div>" +
    '<ul class="timeline">' + PASTE_ROWS.slice(0, 30).map(function (r) {
      return '<li class="tl"><span class="dot ' + (r.expiry ? "sent" : "skipped") + '">' + icon(r.expiry ? "i-check" : "i-alert") + "</span><div><b>" + esc(r.title) + (r.dup ? ' <span class="pill soon">مشابه</span>' : "") + "</b><small>" +
        esc([r.issuer, r.ref].filter(Boolean).join(" · ")) + " · " + (r.expiry ? fmtDate(r.expiry) : (r.rawDate ? "تاريخ غير مفهوم: " + esc(r.rawDate) : "دون تاريخ")) + "</small></div></li>";
    }).join("") + "</ul></div>";
  go.disabled = false;
  go.textContent = "إضافة " + records(PASTE_ROWS.length);
}

  "login-resend": function () { UI.login.code = String(Math.floor(100000 + Math.random() * 900000)); render(); toast("أرسلنا رمزاً جديداً"); },
  "consent-decline": function () {
    openOverlay(modal("لا يمكن المتابعة دون الموافقة", '<p style="margin:0">تحتاج الخدمة إلى موافقتك على سياسة الخصوصية والإقرار بطبيعتها لتعمل. يمكنك العودة في أي وقت.</p><div class="row"><button class="btn" data-act="logout">تسجيل الخروج</button><button class="btn pri" data-act="close">الرجوع للموافقة</button></div>'));
  },
  policy: openPolicy,
  seed: function () { closeOverlays(); seedSample(); save(); rerender(); toast("أُضيفت بيانات شركة نموذجية للتجربة"); },
  "new-list": openNewList,
  "pick-name": function (el) { var i = $("#nl-name"); i.value = el.getAttribute("data-name"); i.focus(); },
  "list-menu": function (el) { openListMenu(el.getAttribute("data-id")); },
  "rename-list": function (el) { openRename(el.getAttribute("data-id")); },
  "archive-list": function (el) {
    var l = getList(el.getAttribute("data-id")); l.archived = true; save(); closeOverlays(); go("#/");
    toast("أُرشفت «" + l.name + "» وتوقفت تنبيهاتها", "تراجع", function () { l.archived = false; save(); rerender(); });
  },
  unarchive: function (el) { var l = getList(el.getAttribute("data-id")); l.archived = false; runEngine(); save(); rerender(); },
  "toggle-archived": function () { UI.showArchived = !UI.showArchived; rerender(); },
  "delete-list": function (el) { openDeleteList(el.getAttribute("data-id")); },
  "export-list": function (el) { var l = getList(el.getAttribute("data-id")); exportCSV(listRecords(l.id).sort(byExpiry), "salahiya-" + l.name.replace(/\s+/g, "-") + ".csv"); },
  "export-all": function () { exportCSV(S.records.filter(function (r) { return !r.deleted; }).sort(byExpiry), "salahiya-all.csv"); },
  "add-rec": function (el) { var r = newRecord(el.getAttribute("data-id"), {}); openRecord(r.id, "f-title"); },
  "delete-rec": function (el) {
    var r = getRec(el.getAttribute("data-id")); r.deleted = true; OPEN_REC = null; save(); closeOverlays(); rerender();
    toast("حُذف «" + r.title + "»", "تراجع", function () { r.deleted = false; save(); rerender(); });
  },
  renew: function (el) { openRenew(el.getAttribute("data-id")); },
  request: function (el) { openRequest(el.getAttribute("data-id")); },
  "cancel-request": function (el) {
    var r = getRec(el.getAttribute("data-id")); r.renewal = { state: "none" }; save(); runEngine(); save();
    openRecord(r.id); toast("أُلغيت حالة «بانتظار التجديد»");
  },
  "pick-follow": function (el) {
    $all('[data-act="pick-follow"]').forEach(function (c) { c.setAttribute("aria-pressed", String(c === el)); });
    $("#rq-date").value = addDays(today(), +el.getAttribute("data-d"));
  },
  override: function (el) { openOverride(el.getAttribute("data-id")); },
  "clear-override": function (el) { var r = getRec(el.getAttribute("data-id")); r.override = null; runEngine(); save(); openRecord(r.id); toast("عاد السجل إلى الإعداد الافتراضي"); },
  chip: function (el) {
    var name = el.getAttribute("data-name"), v = el.getAttribute("data-v");
    $all('[data-chipgroup="' + name + '"] .chip').forEach(function (c) { c.setAttribute("aria-pressed", String(c === el)); });
    var form = el.closest("form"), input = form.elements.namedItem(name);
    if (input) input.value = v;
    updatePreview(form);
  },
  snooze: function (el) {
    var r = getRec(el.getAttribute("data-id")), d = +el.getAttribute("data-days"), t = today();
    var due = addDays(t, d), dayBefore = r.expiry ? addDays(r.expiry, -1) : null;
    if (dayBefore && due >= dayBefore) { toast("سيصلك التذكير مع تنبيه «قبل يوم» في " + fmtDate(dayBefore, true)); return; }
    r.snoozes = r.snoozes || []; r.snoozes.push({ id: uid("s"), due: due, at: t });
    save(); closeOverlays(); rerender(); toast("سنذكّرك في " + fmtDate(due, true));
  },
  "notif-open": function (el) {
    var x = S.notifications.filter(function (q) { return q.id === el.getAttribute("data-id"); })[0];
    if (x) { x.read = true; save(); refreshBadge(); openRecord(x.recordId); }
  },
  "read-all": function () { S.notifications.forEach(function (x) { x.read = true; }); save(); closeOverlays(); rerender(); },
  settings: openSettings,
  emails: openEmails,
  time: openTime,
  "time-add": function (el) {
    S.offset = (S.offset || 0) + +el.getAttribute("data-d");
    var k = runEngine(); save(); closeOverlays(); rerender();
    toast(k ? "وصل " + (k === 1 ? "تنبيه واحد" : k === 2 ? "تنبيهان" : n(k) + " تنبيهات") + " جديدة" : "لا تنبيهات جديدة حتى " + fmtDate(today(), true), k ? "عرضها" : null, openNotifs);
  },
  "time-reset": function () { S.offset = 0; save(); closeOverlays(); rerender(); toast("عدت إلى اليوم الحقيقي"); },
  feedback: openFeedback,
  "fb-copy": function () {
    var txt = feedbackText();
    try { navigator.clipboard.writeText(txt).then(function () { toast("نُسخت الإجابات"); }, function () { toast("تعذّر النسخ"); }); } catch (e) { toast("تعذّر النسخ"); }
  },
  theme: function () {
    S.theme = S.theme === null ? "dark" : S.theme === "dark" ? "light" : null; applyTheme(); save(); openMenu();
  },
  "paste": function (el) { openPaste(el.getAttribute("data-id")); },
  "paste-commit": function (el) {
    var listId = el.getAttribute("data-id");
    PASTE_ROWS.forEach(function (row) { newRecord(listId, { title: row.title.slice(0, 120), issuer: row.issuer, ref: row.ref, expiry: row.expiry, note: row.note }); });
    var k = PASTE_ROWS.length; PASTE_ROWS = [];
    runEngine(); save(); closeOverlays(); rerender(); toast("أُضيف " + records(k));
  },
  wipe: function () {
    if (!window.confirm("سيُحذف كل ما أدخلته على هذا الجهاز نهائياً. متابعة؟")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    S = blankState(); UI.filter = null; closeOverlays(); go("#/"); render();
  },
  logout: function () { S.user = null; save(); closeOverlays(); go("#/"); render(); }
};

/* ---------------- forms ---------------- */
var FORMS = {
  "login-email": submitEmail,
  "login-code": submitCode,
  consent: function (f) {
    if (!$("#c1").checked || !$("#c2").checked) return;
    S.consent = { version: POLICY_VERSION, at: today(), marketing: $("#c3").checked };
    save(); go("#/"); render();
  },
  "new-list": function (f) {
    var name = f.elements.namedItem("name").value.trim(), er = $("#nl-err");
    if (!name) { er.textContent = "اكتب اسماً للقائمة."; er.hidden = false; return; }
    if (S.lists.some(function (l) { return !l.deleted && l.name === name; })) { er.textContent = "لديك قائمة بالاسم نفسه. اختر اسماً آخر."; er.hidden = false; return; }
    var l = { id: uid("l"), name: name, createdAt: today(), archived: false };
    S.lists.push(l); save(); closeOverlays(); UI.search = "";
    go("#/list/" + l.id);
    var r = newRecord(l.id, {}); openRecord(r.id, "f-title");
  },
  rename: function (f) {
    var l = getList(f.getAttribute("data-id")), name = f.elements.namedItem("name").value.trim();
    if (!name) return;
    l.name = name; save(); closeOverlays(); rerender(); toast("حُفظ الاسم");
  },
  "delete-list": function (f) {
    var l = getList(f.getAttribute("data-id")), c = f.elements.namedItem("confirm");
    if (c && c.value.trim() !== l.name) { c.focus(); toast("الاسم غير مطابق"); return; }
    l.deleted = true; save(); closeOverlays(); go("#/");
    toast("حُذفت «" + l.name + "»", "تراجع", function () { l.deleted = false; save(); rerender(); });
  },
  record: submitRecord,
  renew: function (f) {
    var r = getRec(f.getAttribute("data-id")), d = f.elements.namedItem("date").value;
    if (!d) return;
    if (r.expiry && d <= r.expiry) { toast("التاريخ الجديد يجب أن يكون بعد " + fmtDate(r.expiry)); return; }
    r.history = r.history || [];
    if (r.expiry) r.history.push({ expiry: r.expiry, renewedAt: today() });
    r.expiry = d; r.setOn = today(); r.snoozes = []; r.renewal = { state: "none" }; r.updatedAt = today();
    runEngine(); save(); rerender(); openRecord(r.id);
    toast("سُجّل التجديد. التنبيه الأول في " + fmtDate(addDays(d, -alertCfg(r).firstDays), true));
  },
  request: function (f) {
    var r = getRec(f.getAttribute("data-id")), d = f.elements.namedItem("date").value;
    if (!d || d <= today()) { toast("اختر تاريخ متابعة بعد اليوم"); return; }
    r.renewal = { state: "requested", requestedAt: today(), followup: d }; r.updatedAt = today();
    save(); rerender(); openRecord(r.id); toast("الحالة الآن: بانتظار التجديد");
  },
  alerts: function (f) {
    var o = readAlertForm(f), er = $("#s-err");
    if (o.err) { er.textContent = o.err; er.hidden = false; return; }
    if (f.getAttribute("data-scope") === "record") {
      var r = getRec(f.getAttribute("data-id"));
      r.override = { firstDays: o.firstDays, extraDays: o.extraDays, renewAfter: o.renewAfter, renewRepeats: o.renewRepeats };
      runEngine(); save(); rerender(); openRecord(r.id); toast("خُصّصت تنبيهات هذا السجل");
    } else {
      var affected = liveRecords().filter(function (r) { return !r.override && r.expiry && !r.noExpiry; }).length;
      for (var k in o) S.settings[k] = o[k];
      runEngine(); save(); closeOverlays(); rerender();
      toast("طُبّق على " + records(affected));
    }
  },
  feedback: function () {
    var url = "https://wa.me/?text=" + encodeURIComponent(feedbackText());
    window.open(url, "_blank", "noopener");
  }
};

/* ---------------- wiring ---------------- */
function applyTheme() {
  var root = document.documentElement;
  if (S.theme) root.setAttribute("data-theme", S.theme); else root.removeAttribute("data-theme");
}
document.addEventListener("click", function (ev) {
  var scrim = ev.target.closest("[data-scrim]");
  if (scrim && ev.target === scrim) { ACTIONS.close(); return; }
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (el.tagName === "SELECT") return;
  if (ACTIONS[act]) { ev.preventDefault(); ACTIONS[act](el, ev); }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && $("#overlay-root").innerHTML) { ACTIONS.close(); return; }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('li[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("submit", function (ev) {
  var f = ev.target, name = f.getAttribute("data-form");
  if (!name || !FORMS[name]) return;
  ev.preventDefault();
  FORMS[name](f, ev);
});
document.addEventListener("change", function (ev) {
  if (ev.target.id === "c1" || ev.target.id === "c2") { var b = $("#consent-go"); if (b) b.disabled = !($("#c1").checked && $("#c2").checked); }
});
window.addEventListener("hashchange", function () { if (location.hash === RENDERED_HASH) return; UI.filter = null; render(); window.scrollTo(0, 0); });
window.addEventListener("storage", function (ev) { if (ev.key === STORE_KEY) { S = load(); applyTheme(); render(); } });
document.addEventListener("visibilitychange", function () { if (!document.hidden && S && S.user) { if (runEngine()) { save(); rerender(); } } });

/* ---------------- boot ---------------- */
S = load();
applyTheme();
if (S.user) { runEngine(); save(); }
render();
</script>
</body>
</html>
